- name: Verify vault variables are defined
  ansible.builtin.assert:
    that:
      - nut_password is defined and nut_password | length > 0
    fail_msg: "nut_password must be defined in Ansible Vault"

- name: Install NUT
  ansible.builtin.apt:
    name: nut

- name: Install NUT configuration files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/nut/{{ item }}"
    owner: root
    group: nut
    mode: "0640"
  loop:
    - nut.conf
    - ups.conf
    - upsd.conf
    - upsd.users
    - upsmon.conf
  notify: Restart NUT
