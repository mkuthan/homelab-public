# standalone = local UPS, netserver = expose the UPS to the network,
# netclient = monitor a remote UPS.
nut_mode: "netserver"

nut_ups_name: "ups"
nut_ups_driver: "usbhid-ups"
nut_ups_port: "auto"
nut_ups_vendorid: "0463"

nut_hostname: "192.168.1.1"
nut_user: "nut"
nut_password: ""
nut_monitor_type: "primary"
