traefik_ports:
  - "80:80"
  - "443:443"
  - "8080:8080"

# ACME DNS-01 provider (duckdns or cloudflare).
traefik_certificates_resolver: "duckdns"
traefik_acme_email: "admin@example.com"
traefik_cf_api_token: ""
traefik_duckdns_token: ""

# Additional file-provider routers (name, backend).
traefik_http_sites: []
