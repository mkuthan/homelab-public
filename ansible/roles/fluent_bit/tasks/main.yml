- name: Verify vault variables are defined
  ansible.builtin.assert:
    that:
      - fluent_bit_loki_password is defined and fluent_bit_loki_password | length > 0
    fail_msg: "fluent_bit_loki_password must be defined in Ansible Vault"

- name: Add fluent_bit apt key
  ansible.builtin.apt_key:
    url: http://packages.fluentbit.io/fluentbit.key
    keyring: /etc/apt/trusted.gpg.d/fluent_bit.gpg

- name: Add fluent_bit apt repository
  vars:
    fluent_bit_repo_distro: "{{ ansible_facts['lsb']['id'] | lower }}"
    fluent_bit_repo_release: "{{ ansible_facts['distribution_release'] }}"
  ansible.builtin.apt_repository:
    repo: deb https://packages.fluentbit.io/{{ fluent_bit_repo_distro }}/{{ fluent_bit_repo_release }} {{ fluent_bit_repo_release }} main
    filename: "fluent_bit"

- name: Install fluent_bit
  ansible.builtin.apt:
    name: fluent-bit

- name: Create fluent_bit directories
  ansible.builtin.file:
    path: "{{ fluent_bit_var_dir }}"
    mode: "0755"
    state: directory

- name: Configure fluent_bit
  ansible.builtin.template:
    src: fluent-bit.conf.j2
    dest: /etc/fluent-bit/fluent-bit.conf
    mode: "0644"
  notify:
    - Restart fluent-bit

- name: Enable fluent_bit service
  ansible.builtin.systemd:
    name: fluent-bit
    state: started
    enabled: true
