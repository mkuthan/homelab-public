z2m_ports:
  - "8080:8080"

z2m_healthcheck_test: ["CMD", "node", "-e", "fetch('http://localhost:8080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
z2m_healthcheck_start_period: 30s

z2m_adapter_port: "/dev/ttyACM0"
z2m_adapter_baudrate: "115200"
z2m_adapter_type: "zstack"

z2m_mqtt_server: "mqtt://mqtt:1883"
z2m_mqtt_user: "zigbee2mqtt"
z2m_mqtt_password: ""
z2m_mqtt_base_topic: "zigbee2mqtt"
z2m_mqtt_version: "5"

z2m_zigbee_channel: "11"
z2m_zigbee_transmit_power: "5"
z2m_zigbee_network_key: ""
